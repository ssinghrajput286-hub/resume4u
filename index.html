<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#15193B" />
<title>Resume 4U</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<style>
:root{--ink:#15193B;--bg:#F4F5FB;--card:#fff;--gold:#FFB300;--pink:#FF4D8D;--ind:#4F46E5;--mut:#6B7280;--line:#E6E8F2;--top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);font-size:15px;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.screen{display:none;min-height:100vh}
.screen.on{display:block}
.pad-nav{padding-bottom:96px}

/* ---------- hero + home ---------- */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:calc(var(--top) + 34px) 22px 30px;border-radius:0 0 34px 34px}
.hero .b1{position:absolute;right:-50px;top:-40px;width:190px;height:190px;border-radius:50%;background:var(--gold)}
.hero .b2{position:absolute;right:46px;top:96px;width:86px;height:86px;border-radius:50%;border:10px solid var(--pink)}
.hero .b3{position:absolute;left:-30px;bottom:-46px;width:120px;height:120px;border-radius:30px;background:#4F46E5;transform:rotate(22deg)}
.hero h1{position:relative;font-size:36px;line-height:1.06;font-weight:800;letter-spacing:-.8px}
.hero h1 span{color:var(--gold)}
.hero p{position:relative;margin-top:10px;color:#C9CDEB;max-width:250px;line-height:1.4}
.hero .row{position:relative;display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:#ffffff1f;color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.line{background:#fff;border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn:active{transform:scale(.97)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:#374151}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:14px 16px}
.tc{background:none;text-align:left}
.th{position:relative;width:100%;aspect-ratio:794/1123;overflow:hidden;background:#fff;border-radius:10px;box-shadow:0 8px 22px #15193b22,0 0 0 1px #15193b10}
.th .thi{position:absolute;left:0;top:0;width:794px;height:1123px;overflow:hidden;transform-origin:0 0;transform:scale(var(--k,.3));pointer-events:none}
.tc.sel .th{box-shadow:0 0 0 3px var(--gold),0 8px 22px #15193b22}
.tc .nm{margin-top:9px;font-weight:700;font-size:14px}
.tc .tg{font-size:12px;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;font-size:12px;font-weight:600;color:var(--mut)}
.nav button b{font-size:21px;line-height:1}
.nav button.on{color:var(--ink);background:#FFF3CC}

/* ---------- my resumes ---------- */
.ptitle{padding:calc(var(--top) + 26px) 18px 6px;display:flex;justify-content:space-between;align-items:center}
.ptitle h2{font-size:26px;font-weight:800;letter-spacing:-.5px}
.rlist{padding:10px 16px;display:flex;flex-direction:column;gap:14px}
.rcard{display:flex;gap:14px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 16px #15193b10;border:2px solid transparent}
.rcard.sel{border-color:var(--gold)}
.rcard .th{width:96px;flex:none;border-radius:8px}
.rcard .inf{flex:1;min-width:0;display:flex;flex-direction:column}
.rcard h3{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.bar{height:7px;border-radius:9px;background:#E9EAF4;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--pink))}
.rcard .acts{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}

/* ---------- top bars ---------- */
.tbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 10px) 12px 10px;background:#fff;border-bottom:1px solid var(--line)}
.tbar .ib{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:20px;flex:none}
.tbar .rn{flex:1;min-width:0;font-size:17px;font-weight:700;border:none;background:none;color:var(--ink);outline:none;font-family:inherit}
.tbar .tt{flex:1;font-weight:700;font-size:17px}

/* ---------- editor ---------- */
.meter{margin:14px 16px 0;padding:14px 16px;background:var(--ink);color:#fff;border-radius:18px}
.meter .l{display:flex;justify-content:space-between;font-weight:700}
.meter .bar{background:#ffffff26;margin-top:10px}
.meter p{margin-top:9px;font-size:13px;color:#C9CDEB}
.seg{display:flex;gap:6px;margin:14px 16px 4px;padding:5px;background:#E9EAF4;border-radius:15px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #15193b14}
.etab{padding:10px 16px 130px}
.acc{background:#fff;border-radius:18px;margin-bottom:12px;box-shadow:0 3px 12px #15193b0d;overflow:hidden}
.acc>.ah{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left;font-weight:700;font-size:16px}
.acc .ah .ic{width:36px;height:36px;border-radius:11px;background:#FFF3CC;display:flex;align-items:center;justify-content:center;font-size:18px}
.acc .ah .bd{margin-left:auto;font-size:12px;font-weight:700;color:#0F766E;background:#CCFBF1;padding:3px 9px;border-radius:99px}
.acc .ah .bd.no{color:#92400E;background:#FEF3C7}
.acc .ah .ar{color:var(--mut);transition:transform .2s}
.acc.open .ah .ar{transform:rotate(180deg)}
.acc .ab{display:none;padding:2px 16px 16px}
.acc.open .ab{display:block}
.in{width:100%;background:#F7F8FC;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;font-size:15px;font-family:inherit;color:var(--ink);outline:none}
.in:focus{border-color:var(--ind);background:#fff}
textarea.in{min-height:92px;resize:vertical}
.lbl{font-size:12.5px;font-weight:600;color:var(--mut);margin:4px 0 5px}
.grp{background:#F7F8FC;border:1.5px dashed var(--line);border-radius:14px;padding:11px;margin-bottom:10px}
.grp .in{background:#fff}
.grp .gr{display:flex;gap:8px;justify-content:flex-end}
.mini{padding:7px 12px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:600}
.mini.red{color:#DC2626}
.add{width:100%;padding:12px;border-radius:12px;border:2px dashed #C7CBE6;color:var(--ind);font-weight:700}
.sug{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 4px}
.sug button{padding:6px 12px;border-radius:99px;background:#EEF0FF;color:var(--ind);font-weight:600;font-size:13px}
.phrow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.phpick{width:84px;height:84px;border-radius:50%;background:#EEF0FF center/cover;color:var(--ind);font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;flex:none;border:2px dashed #C7CBE6}
.sw{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.sw::-webkit-scrollbar{display:none}
.dot{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.dot.on{box-shadow:0 0 0 3px var(--ink)}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.opt button{padding:9px 15px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.opt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dcard{background:#fff;border-radius:18px;padding:14px 14px 8px;margin-bottom:12px;box-shadow:0 3px 12px #15193b0d}
.dcard h4{font-size:15px;font-weight:700;margin-bottom:10px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .tc{flex:none;width:92px}
.hs .tc .nm{font-size:11.5px;margin-top:5px;text-align:center}
.tog{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;font-weight:600;box-shadow:0 3px 12px #15193b0d}
.tog span{flex:1}
.sw2{width:50px;height:30px;border-radius:99px;background:#D1D5DB;position:relative;transition:.2s;flex:none}
.sw2:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px #0003}
.sw2.on{background:#10B981}.sw2.on:after{left:23px}
.fabbar{position:fixed;left:0;right:0;bottom:0;z-index:18;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#F4F5FB 30%)}

/* ---------- preview ---------- */
.pvwrap{padding:14px 12px 270px;background:#DCDFF0;min-height:100vh}
#pbox{position:relative;width:794px;transform-origin:0 0;box-shadow:0 10px 30px #15193b33;background:#fff}
.pbrk{position:absolute;left:0;right:0;height:0;border-top:3px dashed #ff4d8d;z-index:5}
.pbrk span{position:absolute;right:8px;top:6px;background:#ff4d8d;color:#fff;font:700 12px Outfit;padding:2px 10px;border-radius:99px}
.sample{margin:0 12px;background:#FFF3CC;border-radius:14px;padding:11px 14px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:10px}
.sample button{margin-left:auto}
.pvbar{position:fixed;left:0;right:0;bottom:0;z-index:18;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #15193b22;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pvbar .hs{padding-bottom:6px}
.pvbar .hs .tc{width:62px}
.pvbar .hs .nm{display:none}
.pvbar .row{display:flex;gap:10px}
.pvbar .row .btn{flex:1}
.ov{position:fixed;inset:0;background:#15193bcc;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-weight:700}
.ov.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid #ffffff44;border-top-color:var(--gold);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;z-index:70;display:none;font-weight:600;max-width:86%;text-align:center}

/* ================= RESUME BASE ================= */
.rs{--fs:1;position:relative;display:flex;flex-direction:column;width:794px;min-height:var(--mh,1123px);overflow:hidden;background:#fff;color:#1f2937;font-family:var(--ff),sans-serif;font-size:calc(13px*var(--fs));line-height:1.5;text-align:left;-webkit-user-select:none}
.rs *{box-sizing:border-box;margin:0;padding:0}
.rs h1{font-family:var(--fh),sans-serif;font-size:calc(38px*var(--fs));line-height:1.05;font-weight:800;letter-spacing:-.5px;word-break:break-word}
.rs .ttl{font-size:calc(16px*var(--fs));margin-top:6px;font-weight:500;opacity:.85}
.rs h2{font-family:var(--fh),sans-serif;font-size:calc(14px*var(--fs));font-weight:700;margin:0 0 8px;letter-spacing:.3px}
.rs .sc{margin-bottom:18px}
.rs .it{margin-bottom:11px}
.rs .it .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rs .it b{font-weight:700}
.rs .it .m{opacity:.72;font-size:.93em}
.rs .it p{margin-top:2px}
.rs ul{margin:4px 0 0 17px}
.rs li{margin-bottom:2px}
.rs .chs{display:flex;flex-wrap:wrap;gap:6px}
.rs .ch{background:var(--at);color:var(--a);padding:3px 11px;border-radius:99px;font-weight:600;font-size:.93em}
.rs .bars .bar{height:auto;background:none;margin:0 0 9px;overflow:visible;border-radius:0}
.rs .bars .bar span{display:flex;justify-content:space-between;font-size:.93em;margin-bottom:3px;font-weight:600}
.rs .bars .bar u{display:block;height:6px;border-radius:9px;background:rgba(127,127,127,.28);text-decoration:none;overflow:hidden}
.rs .bars .bar i{display:block;height:100%;border-radius:9px;background:var(--a);background-image:none}
.rs .ct{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px;word-break:break-word;font-size:.95em}
.rs .ct svg{flex:none;width:15px;height:15px;margin-top:2px}
.rs .cin{display:flex;flex-wrap:wrap;gap:6px 18px}
.rs .cin .ct{margin:0}
.rs .ph{width:120px;height:120px;border-radius:var(--pr);flex:none;display:flex;align-items:center;justify-content:center;background-color:var(--a);background-size:cover;background-position:center;color:var(--on);font:800 42px var(--fh),sans-serif}
.rs .cols{flex:1;display:flex}
.rs .rgs{display:flex;flex-wrap:wrap;gap:14px 18px}
.rs .rg{width:88px;text-align:center;font-size:.9em;font-weight:600}
.rs .rg svg{width:76px;height:76px;display:block;margin:0 auto 4px}

.hero .lg{position:relative;width:74px;height:74px;border-radius:50%;display:block;margin-bottom:12px;box-shadow:0 6px 18px #0004}
.aib{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:linear-gradient(90deg,#4F46E5,#FF4D8D);color:#fff;font-weight:700;font-size:13.5px;margin:2px 0 6px}
.aib:active{transform:scale(.97)}
.sheet{position:fixed;inset:0;z-index:80;background:#15193b99;display:none;align-items:flex-end}
.sheet.on{display:flex}
.shcard{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.shcard h3{font-size:19px;font-weight:800;margin-bottom:10px}
.shcard .row2{display:flex;gap:10px;margin-top:6px}
.shcard .row2 .btn{flex:1}
.shcard .ok{color:#059669;font-weight:700;font-size:13px;margin-bottom:8px}
.shcard .er{color:#DC2626;font-weight:600;font-size:14px;line-height:1.4;margin-bottom:10px}
.shcard .wait{padding:26px 0;text-align:center;font-weight:700;color:var(--mut)}
</style>
</head>

/* Smart page breaks: nudge any item that would be cut by a page edge onto the next page. */
function paginate(root){
  const PH=1123,PAD=36;
  const els=[...root.querySelectorAll('.it,li,h2')];
  for(const el of els){
    const cs=getComputedStyle(el);
    if(cs.position==='absolute')continue;
    if(el.tagName==='H2'&&getComputedStyle(el.parentNode).display==='grid')continue;
    const o=root.getBoundingClientRect().top,rc=el.getBoundingClientRect();
    const t=rc.top-o,b=rc.bottom-o;
    if(rc.height<1||rc.height>PH-2*PAD)continue;
    const page=Math.floor(t/PH),end=(page+1)*PH-PAD;
    const need=el.tagName==='H2'?b+64:b;   // keep a heading together with its first item
    if(need>end){el.style.marginTop=((parseFloat(cs.marginTop)||0)+((page+1)*PH+PAD-t))+'px'}
  }
}

  if(sh('experience')&&ex.length){head('Experience');ex.forEach(e=>{row(e.role,e.period);if(e.company)line(e.company,10,'italic',grey,M,CW);bullets(e.details);y+=5})}
  const ed=d.education.filter(e=>e.degree||e.school);
  if(sh('education')&&ed.length){head('Education');ed.forEach(e=>{row(e.degree,e.year);if(e.school)line(e.school,10,'normal',grey,M,CW);y+=4})}
  const sk=csv(d.skills).map(x=>x.replace(/:\d+$/,''));
  if(sh('skills')&&sk.length){head('Skills');line(sk.join(', '),10,'normal',dark,M,CW)}
  const pr=d.projects.filter(x=>x.name||x.desc);
  if(sh('projects')&&pr.length){head('Projects');pr.forEach(x=>{row(x.name,'');if(x.desc)line(x.desc,10,'normal',dark,M,CW);y+=4})}
  if(sh('certs')&&lines(d.certs).length){head('Certifications');bullets(d.certs)}
  if(sh('achievements')&&lines(d.achievements).length){head('Achievements');bullets(d.achievements)}
  if(sh('languages')&&csv(d.languages).length){head('Languages');line(csv(d.languages).join(', '),10,'normal',dark,M,CW)}
  if(sh('hobbies')&&csv(d.hobbies).length){head('Hobbies');line(csv(d.hobbies).join(', '),10,'normal',dark,M,CW)}
  return p.output('datauristring').split(',')[1];
}
async function shareFile(b64,name,mime){
  const P=window.Capacitor&&Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){const f=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:'Resume',url:f.uri,dialogTitle:'Resume share ya save karo'})}
  else{const a=document.createElement('a');a.href=`data:${mime};base64,${b64}`;a.download=name;a.click()}
}

async function exportAs(kind){
  const r=cur();$('#ovt').textContent=kind==='png'?'Image ban rahi hai...':'PDF ban rahi hai...';$('#ov').classList.add('on');
  try{
    if(kind==='text'){
      if(!window.jspdf)throw new Error('PDF library load nahi hui');
      await shareFile(buildTextPdf(r),((r.d.name||'resume').replace(/[^a-z0-9]+/gi,'_'))+'_resume_text.pdf','application/pdf');
      $('#ov').classList.remove('on');return;
    }
    if(!window.html2canvas)throw new Error('PDF library load nahi hui');
    await (document.fonts&&document.fonts.ready);
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-9000px;top:0;width:794px;background:#fff';host.innerHTML=rs(r);document.body.appendChild(host);
    await new Promise(r=>setTimeout(r,250));
    paginate(host.firstChild);
    const pages=Math.max(1,Math.ceil(host.offsetHeight/1123-.02));host.firstChild.style.setProperty('--mh',pages*1123+'px');
    await new Promise(r=>setTimeout(r,80));
    const canvas=await html2canvas(host.firstChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:794,height:pages*1123,windowWidth:794});
    document.body.removeChild(host);
    const base=(r.d.name||'resume').replace(/[^a-z0-9]+/gi,'_');
    let b64,name,mime;
    if(kind==='pdf'){
      const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','pt','a4');const W=pdf.internal.pageSize.getWidth(),Hh=pdf.internal.pageSize.getHeight();const ph=1123*2;
      for(let i=0;i<pages;i++){const c=document.createElement('canvas');c.width=canvas.width;c.height=ph;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,ph);x.drawImage(canvas,0,i*ph,canvas.width,ph,0,0,canvas.width,ph);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',0,0,W,Hh)}
      b64=pdf.output('datauristring').split(',')[1];name=base+'_resume.pdf';mime='application/pdf';
    }else{b64=canvas.toDataURL('image/png').split(',')[1];name=base+'_resume.png';mime='image/png'}
    const P=window.Capacitor&&Capacitor.Plugins;
    if(P&&P.Filesystem&&P.Share){const f=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:'Resume',url:f.uri,dialogTitle:'Resume share ya save karo'})}
    else{const a=document.createElement('a');a.href=`data:${mime};base64,${b64}`;a.download=name;a.click()}
  }catch(e){if(!/cancel/i.test(e.message||''))toast('Error: '+(e.message||e))}
  $('#ov').classList.remove('on');
}

/* ============================================================
   AI (OpenRouter) - key sirf phone ke localStorage me rehti hai
============================================================ */
const MODELS=['meta-llama/llama-3.3-70b-instruct:free','google/gemma-3-27b-it:free','mistralai/mistral-7b-instruct:free'];
const gk=()=>{try{return localStorage.getItem('or_key')||''}catch(e){return ''}};
const gm=()=>{try{return localStorage.getItem('or_model')||''}catch(e){return ''}};
function openSheet(h){$('#shcard').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function openSettings(){
  openSheet(`<h3>⚙️ AI Settings</h3>
  ${gk()?'<div class="ok">✓ Key saved hai (naya daaloge to badal jayegi)</div>':''}
  <div class="lbl">OpenRouter API key. Sirf is phone me save hoti hai.</div>
  <input class="in" id="ak" type="password" autocomplete="off" placeholder="sk-or-v1-...">
  <div class="lbl">Model (khaali chhodo to auto)</div>
  <input class="in" id="am" placeholder="meta-llama/llama-3.3-70b-instruct:free" value="${esc(gm())}">
  <div class="lbl">Key yahan banti hai: openrouter.ai/keys</div>
  <div class="row2"><button class="btn gold" onclick="saveSettings()">Save</button><button class="btn line" onclick="closeSheet()">Band karo</button></div>
  ${gk()?'<button class="btn line full sm" style="margin-top:10px;color:#DC2626" onclick="delKey()">Key hatao</button>':''}`);
}
function saveSettings(){
  const k=$('#ak').value.trim(),m=$('#am').value.trim();
  try{if(k)localStorage.setItem('or_key',k);if(m)localStorage.setItem('or_model',m);else localStorage.removeItem('or_model')}catch(e){}
  closeSheet();toast(k||gk()?'Settings save ho gayi':'Key daalo');
}
function delKey(){try{localStorage.removeItem('or_key')}catch(e){}closeSheet();toast('Key hata di')}

async function callAI(system,user){
  const key=gk();
  if(!key){openSettings();throw new Error('NOKEY')}
  const list=gm()?[gm()]:MODELS;let last='';
  for(const m of list){
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),45000);
    try{
      const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal:ctl.signal,
        headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','X-Title':'Resume 4U'},
        body:JSON.stringify({model:m,temperature:.4,max_tokens:700,messages:[{role:'system',content:system},{role:'user',content:user}]})});
      const j=await res.json().catch(()=>({}));
      if(res.status===401){clearTimeout(to);throw new Error('KEYBAD')}
      const t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(res.ok&&t&&t.trim()){clearTimeout(to);return t.trim()}
      last=(j.error&&j.error.message)||('Error '+res.status);
    }catch(e){
      clearTimeout(to);
      if(e.message==='KEYBAD')throw e;
      last=e.name==='AbortError'?'Time out ho gaya. Net check karo.':(e.message||'Net error');
    }
  }
  throw new Error(last||'AI se jawab nahi aaya');
}
function cleanAI(t,multi){
  t=t.replace(/```[a-z]*\n?|```/g,'').trim().replace(/^["“]+|["”]+$/g,'');
  if(multi)return t.split('\n').map(l=>l.replace(/^\s*([-•*–]|\d+[.)])\s*/,'').trim()).filter(Boolean).join('\n');
  return t.replace(/\s*\n+\s*/g,' ');
}
const RULES=' Write in clear, professional English (translate if the input is Hindi or Hinglish). Use strong action verbs, be concise and specific. NEVER invent facts, numbers, employers or tools that are not in the input. Return ONLY the final text, no explanation, no quotes, no markdown.';
const AIK={
  summary:{multi:false,sys:'You are an expert resume writer. Write a professional resume summary of 2-3 sentences (max 55 words), first person without using "I".'+RULES},
  details:{multi:true,sys:'You are an expert resume writer. Rewrite the work experience as concise achievement-focused bullet points, one point per line, each starting with a strong action verb. Do not add bullet symbols or numbering.'+RULES},
  desc:{multi:false,sys:'You are an expert resume writer. Rewrite the project description in 1-2 crisp sentences that say what it does and the value or tech used.'+RULES},
  achievements:{multi:true,sys:'You are an expert resume writer. Polish each achievement into a short, impactful line. Keep one achievement per line, same count as the input. Do not add bullet symbols or numbering.'+RULES}
};
let AIT=null;
function aiSrc(kind,key,i,field){const d=cur().d;return kind==='summary'?d.summary:kind==='achievements'?d.achievements:d[key][i][field]}
async function aiRun(kind,key,i,field){
  AIT={kind,key,i,field};
  const d=cur().d;let txt=(aiSrc(kind,key,i,field)||'').trim();
  let user='';
  if(kind==='summary'){
    const ex=d.experience.filter(e=>e.role).map(e=>e.role+(e.company?' at '+e.company:'')).join('; ');
    const ctx='Job title: '+(d.title||'-')+'\nSkills: '+(csv(d.skills).map(x=>x.replace(/:\d+$/,'')).join(', ')||'-')+'\nExperience: '+(ex||'-')+'\nEducation: '+(d.education.filter(e=>e.degree).map(e=>e.degree).join('; ')||'-');
    if(!txt&&!d.title&&!ex)return toast('Pehle job title ya experience bharo');
    user=txt?('Improve this summary.\n\nCurrent summary: '+txt+'\n\nContext:\n'+ctx):('Write a summary from this context only:\n'+ctx);
  }else{
    if(txt.length<8)return toast('Pehle thoda likho, phir AI behtar karega');
    const role=kind==='details'?(d[key][i].role||'')+' '+(d[key][i].company||''):kind==='desc'?(d[key][i].name||''):'';
    user=(role.trim()?'Context: '+role.trim()+'\n\n':'')+'Text:\n'+txt;
  }
  openSheet('<h3>✨ AI likh raha hai</h3><div class="wait">Thoda ruko...</div>');
  try{
    const out=cleanAI(await callAI(AIK[kind].sys,user),AIK[kind].multi);
    if(!out)throw new Error('Khaali jawab aaya, dobara try karo');
    openSheet(`<h3>✨ AI ka sujhav</h3><div class="lbl">Chaho to lagane se pehle edit kar lo.</div><textarea class="in" id="aiOut" style="min-height:170px">${esc(out)}</textarea>
    <div class="row2"><button class="btn gold" onclick="aiApply()">Lagao ✓</button><button class="btn line" onclick="aiRun('${kind}','${key||''}',${i||0},'${field||''}')">Dobara</button></div>
    <button class="btn line full sm" style="margin-top:10px" onclick="closeSheet()">Rehne do</button>`);
  }catch(e){
    if(e.message==='NOKEY')return;
    const msg=e.message==='KEYBAD'?'Key galat hai ya band ho gayi. Nayi key daalo.':e.message;
    openSheet(`<h3>Kuch gadbad hui</h3><div class="er">${esc(msg)}</div><div class="row2"><button class="btn gold" onclick="openSettings()">⚙️ Settings</button><button class="btn line" onclick="closeSheet()">Band karo</button></div>`);
  }
}
function aiApply(){
  const v=$('#aiOut').value.trim();if(!v||!AIT)return closeSheet();
  const {kind,key,i,field}=AIT,d=cur().d;
  if(kind==='summary')d.summary=v;else if(kind==='achievements')d.achievements=v;else d[key][i][field]=v;
  touch();persist();closeSheet();drawTab();toast('Lag gaya ✓');
}
