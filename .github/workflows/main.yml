name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy fonts and PDF libraries into www
        run: node prep.js

      - name: Copy index.html into www
        run: |
          mkdir -p www
          cp index.html www/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash
        continue-on-error: true
        run: |
          pip install pillow
          mkdir -p assets
          python - <<'EOF'
          from PIL import Image
          img = Image.open("logo.png").convert("RGBA")
          img.resize((1024, 1024)).save("assets/icon-only.png")
          bg = Image.new("RGBA", (2732, 2732), (253, 248, 228, 255))
          big = img.resize((1100, 1100))
          bg.paste(big, ((2732 - 1100) // 2, (2732 - 1100) // 2), big)
          bg.save("assets/splash.png")
          EOF
          npx capacitor-assets generate --android

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resume-4U-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Resume 4U v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
